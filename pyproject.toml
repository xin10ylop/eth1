[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ethpredict"
version = "1.0.0"
description = "10-second to 5-minute Ethereum forecaster (Binance spot & USD-M perpetual) with live CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "requests>=2.31",
]

[project.optional-dependencies]
reports = ["matplotlib>=3.8"]
research = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
ethpredict-live = "ethpredict.live.cli:main"

[tool.setuptools.packages.find]
include = ["ethpredict*"]
